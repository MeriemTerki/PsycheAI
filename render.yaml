# Render Blueprint for PsycheAI
# https://render.com/docs/blueprint-spec
#
# Deployment Instructions:
# 1. Fork/clone this repository
# 2. Connect to Render.com and create a new Blueprint
# 3. Add the required environment variables (API keys)
# 4. Deploy!

services:
  # Main Orchestration API
  - type: web
    name: psycheai-main-api
    runtime: docker
    dockerfilePath: ./backend/app/Dockerfile
    dockerContext: ./backend/app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: GAZE_CAPTURE_URL
        value: https://psycheai-gaze-tracking.onrender.com/capture-eye-tracking
      - key: GAZE_REPORT_URL
        value: https://psycheai-gaze-tracking.onrender.com/generate-eye-tracking-report
      - key: EMOTION_API_URL
        value: https://psycheai-emotion-recognition.onrender.com/analyze-live-emotion
      - key: CHAT_API_URL
        value: https://psycheai-voice-agent.onrender.com/chat
      - key: TRANSCRIPT_GET_URL
        value: https://psycheai-voice-agent.onrender.com/transcript

  # Voice Agent Service
  - type: web
    name: psycheai-voice-agent
    runtime: docker
    dockerfilePath: ./backend/voiceAgent/Dockerfile
    dockerContext: ./backend/voiceAgent
    healthCheckPath: /health
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: voice-agent
      - key: COHERE_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_ORIGINS
        value: "*"

  # Emotion Recognition Service
  - type: web
    name: psycheai-emotion-recognition
    runtime: docker
    dockerfilePath: ./backend/emotion-recognition/Dockerfile
    dockerContext: ./backend/emotion-recognition
    healthCheckPath: /health
    plan: free
    envVars:
      - key: FRONTEND_ORIGINS
        value: "*"

  # Gaze Tracking Service
  - type: web
    name: psycheai-gaze-tracking
    runtime: docker
    dockerfilePath: ./backend/gaze-tracking/Dockerfile
    dockerContext: ./backend/gaze-tracking
    healthCheckPath: /health
    plan: free
    envVars:
      - key: FRONTEND_ORIGINS
        value: "*"

  # Frontend Static Site
  - type: web
    name: psycheai-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_MAIN_API_URL
        value: https://psycheai-main-api.onrender.com
      - key: VITE_EMOTION_API_URL
        value: https://psycheai-emotion-recognition.onrender.com
      - key: VITE_GAZE_API_URL
        value: https://psycheai-gaze-tracking.onrender.com
      - key: VITE_VOICE_API_URL
        value: https://psycheai-voice-agent.onrender.com
